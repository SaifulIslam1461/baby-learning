<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Learning Video & Photo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .video-container {
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            height: calc(100vh - 160px);
        }
        .video-card {
            scroll-snap-align: start;
            height: calc(100vh - 160px);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-black font-sans text-gray-800 select-none">

    <!-- 1. Top Slim & Minimal Header -->
    <header class="bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 text-white px-3 py-1 shadow-sm sticky top-0 z-50 flex justify-between items-center h-8">
        <h1 class="text-xs font-bold flex items-center gap-1 tracking-wide">
            <i class="fa-solid fa-child-reaching text-yellow-300 text-sm"></i> Kids Learning
        </h1>
        <span class="text-[10px] text-white/80 font-medium">অফলাইন ভার্সন</span>
    </header>

    <!-- 2. Kids Photo Banner Section with Three Dot Menu on Right Corner -->
    <div class="bg-gradient-to-r from-indigo-950 via-purple-950 to-pink-950 py-1.5 px-3 border-b border-purple-900 shadow-inner relative flex items-center justify-between">
        <div id="kids-banner-container" class="max-w-[calc(100%-35px)] flex gap-2 overflow-x-auto no-scrollbar items-center">
            <div class="text-[11px] text-purple-300 italic whitespace-nowrap py-0.5">✨ বাচ্চাদের ছবি যুক্ত করুন...</div>
        </div>

        <!-- Three Dot Menu Button moved to Kids Photo Layer Right Corner -->
        <div class="relative flex-shrink-0">
            <button onclick="toggleDropdown()" class="text-purple-200 hover:text-white p-1 rounded-full hover:bg-white/10 transition focus:outline-none">
                <i class="fa-solid fa-ellipsis-vertical text-base"></i>
            </button>
            
            <!-- Dropdown Menu -->
            <div id="dropdown-menu" class="hidden absolute right-0 mt-1 w-48 bg-white rounded-xl shadow-2xl py-2 text-gray-800 z-50 border border-gray-100">
                <button onclick="openUploadModal(); toggleDropdown();" class="w-full text-left px-4 py-2.5 text-xs font-bold hover:bg-purple-50 text-purple-700 flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle text-base"></i> ফাইল যোগ করুন
                </button>
                <button onclick="openManagementModal(); toggleDropdown();" class="w-full text-left px-4 py-2.5 text-xs font-bold hover:bg-purple-50 text-indigo-700 flex items-center gap-2 border-t border-gray-100">
                    <i class="fa-solid fa-gear text-base"></i> ম্যানেজমেন্ট ও ডিলিট
                </button>
            </div>
        </div>
    </div>

    <!-- Sub-Header: Categories & Tabs -->
    <div class="bg-gray-900/95 backdrop-blur-md border-b border-gray-800 px-2 py-1 sticky top-[32px] z-40 space-y-1">
        <div class="max-w-md mx-auto flex gap-1 bg-gray-800 p-0.5 rounded-md">
            <button id="tab-video" onclick="switchTab('video')" class="flex-1 py-1 rounded text-center font-bold text-xs bg-purple-600 text-white shadow">
                <i class="fa-solid fa-video mr-1"></i> ভিডিও
            </button>
            <button id="tab-photo" onclick="switchTab('photo')" class="flex-1 py-1 rounded text-center font-bold text-xs text-gray-300">
                <i class="fa-solid fa-image mr-1"></i> ছবি
            </button>
        </div>

        <div class="max-w-md mx-auto flex gap-1.5 overflow-x-auto no-scrollbar py-0.5 text-xs font-semibold">
            <button onclick="setCategory('সব')" class="cat-btn bg-purple-600 text-white px-3 py-0.5 rounded-full whitespace-nowrap shadow-sm">সব</button>
            <button onclick="setCategory('বাংলা')" class="cat-btn bg-gray-800 text-gray-300 px-3 py-0.5 rounded-full whitespace-nowrap">বাংলা</button>
            <button onclick="setCategory('ইংরেজি')" class="cat-btn bg-gray-800 text-gray-300 px-3 py-0.5 rounded-full whitespace-nowrap">ইংরেজি</button>
            <button onclick="setCategory('অংক')" class="cat-btn bg-gray-800 text-gray-300 px-3 py-0.5 rounded-full whitespace-nowrap">অংক</button>
            <button onclick="setCategory('আরবি')" class="cat-btn bg-gray-800 text-gray-300 px-3 py-0.5 rounded-full whitespace-nowrap">আরবি</button>
            <button onclick="setCategory('ইসলামিক')" class="cat-btn bg-gray-800 text-gray-300 px-3 py-0.5 rounded-full whitespace-nowrap">ইসলামিক</button>
            <button onclick="setCategory('অন্যান্য')" class="cat-btn bg-gray-800 text-gray-300 px-3 py-0.5 rounded-full whitespace-nowrap">অন্যান্য</button>
        </div>
    </div>

    <!-- Main Content Container with Centered Video Layout -->
    <main class="max-w-md mx-auto relative min-h-[calc(100vh-160px)]">
        <section id="video-section" class="video-container no-scrollbar relative bg-black flex flex-col items-center justify-center">
        </section>
        
        <section id="photo-section" class="hidden p-3 grid grid-cols-2 gap-3 pb-20 pt-4">
        </section>

        <div id="empty-state" class="hidden flex flex-col items-center justify-center p-8 text-center text-gray-400 mt-12">
            <i class="fa-solid fa-folder-open text-5xl mb-3 text-amber-300"></i>
            <p class="font-medium text-gray-400">কোনো ফাইল পাওয়া যায়নি!</p>
        </div>
    </main>

    <!-- Fullscreen Photo Modal -->
    <div id="photo-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex flex-col items-center justify-center p-4">
        <button onclick="closePhotoModal()" class="absolute top-4 right-4 text-white text-3xl p-2 z-10"><i class="fa-solid fa-xmark"></i></button>
        <img id="modal-img" src="" class="max-w-full max-h-[80vh] object-contain rounded-lg">
        <p id="modal-title" class="text-white mt-3 font-semibold text-lg text-center"></p>
    </div>

    <!-- Upload Modal -->
    <div id="upload-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-lg text-purple-900"><i class="fa-solid fa-cloud-arrow-up text-pink-500"></i> নতুন ফাইল যোগ করুন</h3>
                <button onclick="closeUploadModal()" class="text-gray-400 hover:text-gray-600 text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="upload-form" onsubmit="handleFormSubmit(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">ফাইলের ধরন</label>
                    <select id="file-type" onchange="toggleCategorySelect()" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-purple-500 outline-none">
                        <option value="video">ভিডিও (Video)</option>
                        <option value="photo">ছবি (Photo)</option>
                        <option value="kids_banner">বাচ্চাদের ছবি (Top Banner)</option>
                    </select>
                </div>
                <div id="category-container">
                    <label class="block text-xs font-bold text-gray-700 mb-1">ক্যাটাগরি</label>
                    <select id="file-category" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-purple-500 outline-none">
                        <option value="বাংলা">বাংলা</option>
                        <option value="ইংরেজি">ইংরেজি</option>
                        <option value="অংক">অংক</option>
                        <option value="আরবি">আরবি</option>
                        <option value="ইসলামিক">ইসলামিক শিক্ষা</option>
                        <option value="অন্যান্য">অন্যান্য</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">শিরোনাম / নাম</label>
                    <input type="text" id="file-title" required placeholder="শিরোনাম দিন" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-purple-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">ফাইল নির্বাচন করুন</label>
                    <input type="file" id="file-input" accept="video/*,image/*" required class="w-full text-xs text-gray-500 file:mr-2 file:py-2 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-purple-100 file:text-purple-700 hover:file:bg-purple-200">
                </div>
                <div class="pt-2 flex gap-2">
                    <button type="button" onclick="closeUploadModal()" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded-xl text-sm font-bold">বাতিল</button>
                    <button type="submit" id="save-btn" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white py-2 rounded-xl text-sm font-bold shadow-md">সংরক্ষণ করুন</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Management Modal with Search & Delete -->
    <div id="management-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-4 max-h-[80vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-lg text-purple-900"><i class="fa-solid fa-list-check text-indigo-500"></i> ম্যানেজমেন্ট ও ডিলিট</h3>
                <button onclick="closeManagementModal()" class="text-gray-400 hover:text-gray-600 text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="sticky top-0 bg-white z-10 pb-2">
                <label class="block text-xs font-bold text-gray-700 mb-1">খুঁজুন</label>
                <div class="relative">
                    <input type="text" id="manage-search-input" oninput="renderManagementList()" placeholder="শিরোনাম দিয়ে খুঁজুন..." class="w-full bg-gray-50 border border-gray-300 rounded-lg pl-9 pr-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400 text-xs"></i>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 mb-2">ফাইল তালিকা ও ডিলিট অপশন</label>
                <div id="management-list" class="space-y-2">
                </div>
            </div>
        </div>
    </div>

    <script>
        let db;
        const dbName = "KidsLearningDB";
        const storeName = "mediaStore";

        const request = indexedDB.open(dbName, 1);
        request.onupgradeneeded = function(e) {
            db = e.target.result;
            if (!db.objectStoreNames.contains(storeName)) {
                db.createObjectStore(storeName, { keyPath: "id", autoIncrement: true });
            }
        };
        request.onsuccess = function(e) {
            db = e.target.result;
            renderContent();
            renderKidsBanner();
        };

        let currentTab = 'video';
        let currentCategory = 'সব';
        let mediaItems = [];

        function toggleDropdown() {
            const menu = document.getElementById('dropdown-menu');
            menu.classList.toggle('hidden');
        }

        window.onclick = function(event) {
            if (!event.target.closest('button')) {
                const menu = document.getElementById('dropdown-menu');
                if(menu) menu.classList.add('hidden');
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            const videoBtn = document.getElementById('tab-video');
            const photoBtn = document.getElementById('tab-photo');
            const videoSec = document.getElementById('video-section');
            const photoSec = document.getElementById('photo-section');

            if(tab === 'video') {
                videoBtn.className = "flex-1 py-1 rounded text-center font-bold text-xs bg-purple-600 text-white shadow";
                photoBtn.className = "flex-1 py-1 rounded text-center font-bold text-xs text-gray-300";
                videoSec.classList.remove('hidden');
                photoSec.classList.add('hidden');
            } else {
                photoBtn.className = "flex-1 py-1 rounded text-center font-bold text-xs bg-purple-600 text-white shadow";
                videoBtn.className = "flex-1 py-1 rounded text-center font-bold text-xs text-gray-300";
                photoSec.classList.remove('hidden');
                videoSec.classList.add('hidden');
            }
            renderContent();
        }

        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if(btn.innerText === cat) {
                    btn.className = "cat-btn bg-purple-600 text-white px-3 py-0.5 rounded-full whitespace-nowrap shadow-sm";
                } else {
                    btn.className = "cat-btn bg-gray-800 text-gray-300 px-3 py-0.5 rounded-full whitespace-nowrap";
                }
            });
            renderContent();
        }

        function renderKidsBanner() {
            if(!db) return;
            const tx = db.transaction(storeName, "readonly");
            const store = tx.objectStore(storeName);
            const getAll = store.getAll();

            getAll.onsuccess = function() {
                const allItems = getAll.result;
                const banners = allItems.filter(item => item.type === 'kids_banner');
                const bannerContainer = document.getElementById('kids-banner-container');

                if(banners.length === 0) {
                    bannerContainer.innerHTML = `<div class="text-[11px] text-purple-300 italic whitespace-nowrap py-0.5">✨ বাচ্চাদের ছবি যুক্ত করুন...</div>`;
                    return;
                }

                bannerContainer.innerHTML = banners.map(item => {
                    const blobUrl = URL.createObjectURL(item.fileBlob);
                    return `
                        <div class="flex-shrink-0 w-11 h-11 rounded-full overflow-hidden border-2 border-pink-400 shadow-md cursor-pointer hover:scale-105 transition" onclick="openPhotoModal('${blobUrl}', '${item.title}')">
                            <img src="${blobUrl}" class="w-full h-full object-cover">
                        </div>
                    `;
                }).join('');
            }
        }

        function renderContent() {
            if(!db) return;
            const tx = db.transaction(storeName, "readonly");
            const store = tx.objectStore(storeName);
            const getAll = store.getAll();

            getAll.onsuccess = function() {
                mediaItems = getAll.result;
                const filtered = mediaItems.filter(item => {
                    const matchesTab = item.type === currentTab;
                    const matchesCat = currentCategory === 'সব' || item.category === currentCategory;
                    return matchesTab && matchesCat;
                });

                const videoSec = document.getElementById('video-section');
                const photoSec = document.getElementById('photo-section');
                const emptyState = document.getElementById('empty-state');

                if(filtered.length === 0) {
                    videoSec.innerHTML = '';
                    photoSec.innerHTML = '';
                    emptyState.classList.remove('hidden');
                    return;
                }
                emptyState.classList.add('hidden');

                if(currentTab === 'video') {
                    videoSec.innerHTML = filtered.map((item) => {
                        const blobUrl = URL.createObjectURL(item.fileBlob);
                        return `
                            <div class="video-card w-full relative bg-black flex items-center justify-center">
                                <video id="video-${item.id}" src="${blobUrl}" class="w-full h-full object-contain mx-auto" loop playsinline></video>
                                
                                <div class="absolute bottom-6 left-4 right-20 text-white bg-black/50 p-3 rounded-xl backdrop-blur-sm">
                                    <span class="bg-purple-600 text-[10px] font-bold px-2 py-0.5 rounded-full mb-1 inline-block">${item.category}</span>
                                    <h3 class="font-bold text-base truncate">${item.title}</h3>
                                </div>

                                <div class="absolute right-3 bottom-12 flex flex-col gap-4 items-center z-10">
                                    <button onclick="togglePlay(${item.id})" class="w-12 h-12 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center text-white text-xl shadow">
                                        <i id="play-icon-${item.id}" class="fa-solid fa-play"></i>
                                    </button>
                                    <button onclick="toggleMute(${item.id})" class="w-12 h-12 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center text-white text-xl shadow">
                                        <i id="mute-icon-${item.id}" class="fa-solid fa-volume-high"></i>
                                    </button>
                                </div>
                            </div>
                        `;
                    }).join('');
                    setupIntersectionObserver();
                } else {
                    photoSec.innerHTML = filtered.map(item => {
                        const blobUrl = URL.createObjectURL(item.fileBlob);
                        return `
                            <div class="bg-gray-900 rounded-2xl shadow-sm overflow-hidden border border-gray-800 flex flex-col relative group">
                                <img src="${blobUrl}" onclick="openPhotoModal('${blobUrl}', '${item.title}')" class="w-full h-36 object-cover cursor-pointer">
                                <div class="p-2 flex justify-between items-center bg-gray-900">
                                    <div class="overflow-hidden">
                                        <span class="text-[10px] text-purple-400 font-bold bg-purple-950 px-1.5 py-0.5 rounded">${item.category}</span>
                                        <p class="text-xs font-bold text-gray-200 truncate mt-0.5">${item.title}</p>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                }
            };
        }

        let observer;
        function setupIntersectionObserver() {
            if(observer) observer.disconnect();
            observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    if(!video) return;
                    const id = video.id.replace('video-', '');
                    const playIcon = document.getElementById(`play-icon-${id}`);

                    if (entry.isIntersecting) {
                        video.play().then(() => {
                            if(playIcon) playIcon.className = 'fa-solid fa-pause';
                        }).catch(() => {});
                    } else {
                        video.pause();
                        if(playIcon) playIcon.className = 'fa-solid fa-play';
                    }
                });
            }, { threshold: 0.6 });

            document.querySelectorAll('.video-card').forEach(card => observer.observe(card));
        }

        function togglePlay(id) {
            const video = document.getElementById(`video-${id}`);
            const icon = document.getElementById(`play-icon-${id}`);
            if(video.paused) {
                video.play();
                icon.className = 'fa-solid fa-pause';
            } else {
                video.pause();
                icon.className = 'fa-solid fa-play';
            }
        }

        function toggleMute(id) {
            const video = document.getElementById(`video-${id}`);
            const icon = document.getElementById(`mute-icon-${id}`);
            video.muted = !video.muted;
            icon.className = video.muted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const type = document.getElementById('file-type').value;
            const category = document.getElementById('file-category').value;
            const title = document.getElementById('file-title').value;
            const fileInput = document.getElementById('file-input');

            if(fileInput.files.length === 0) return;
            const fileBlob = fileInput.files[0];

            const saveBtn = document.getElementById('save-btn');
            saveBtn.innerText = "সংরক্ষণ হচ্ছে...";
            saveBtn.disabled = true;

            const tx = db.transaction(storeName, "readwrite");
            const store = tx.objectStore(storeName);

            const newItem = {
                type: type,
                category: category,
                title: title,
                fileBlob: fileBlob,
                createdAt: new Date().getTime()
            };

            store.add(newItem);
            tx.oncomplete = function() {
                saveBtn.innerText = "সংরক্ষণ করুন";
                saveBtn.disabled = false;
                closeUploadModal();
                document.getElementById('upload-form').reset();
                if(type === 'kids_banner') {
                    renderKidsBanner();
                } else {
                    switchTab(type);
                }
            };
        }

        function deleteMedia(id) {
            if(confirm("আপনি কি নিশ্চিত যে এটি ডিলিট করতে চান?")) {
                const tx = db.transaction(storeName, "readwrite");
                const store = tx.objectStore(storeName);
                store.delete(id);
                tx.oncomplete = function() {
                    renderContent();
                    renderKidsBanner();
                    renderManagementList();
                };
            }
        }

        function openUploadModal() { document.getElementById('upload-modal').classList.remove('hidden'); }
        function closeUploadModal() { document.getElementById('upload-modal').classList.add('hidden'); }
        
        function openManagementModal() {
            document.getElementById('management-modal').classList.remove('hidden');
            renderManagementList();
        }
        function closeManagementModal() { document.getElementById('management-modal').classList.add('hidden'); }

        function openPhotoModal(url, title) {
            document.getElementById('modal-img').src = url;
            document.getElementById('modal-title').innerText = title;
            document.getElementById('photo-modal').classList.remove('hidden');
        }
        function closePhotoModal() { document.getElementById('photo-modal').classList.add('hidden'); }

        function renderManagementList() {
            if(!db) return;
            const tx = db.transaction(storeName, "readonly");
            const store = tx.objectStore(storeName);
            const getAll = store.getAll();

            getAll.onsuccess = function() {
                const allItems = getAll.result;
                const searchQuery = document.getElementById('manage-search-input').value.toLowerCase();
                
                const filtered = allItems.filter(item => item.title.toLowerCase().includes(searchQuery));

                const listContainer = document.getElementById('management-list');
                listContainer.innerHTML = filtered.map(item => `
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg border border-gray-100">
                        <div>
                            <p class="text-sm font-bold text-gray-800">${item.title}</p>
                            <span class="text-[10px] text-purple-600 font-bold bg-purple-50 px-1.5 py-0.5 rounded">${item.type.toUpperCase()} - ${item.category}</span>
                        </div>
                        <button onclick="deleteMedia(${item.id})" class="text-red-500 hover:text-red-700 p-2">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `).join('');
            }
        }

        function toggleCategorySelect() {
            const type = document.getElementById('file-type').value;
            const categoryContainer = document.getElementById('category-container');
            if (type === 'photo' || type === 'kids_banner') {
                categoryContainer.classList.add('hidden');
            } else {
                categoryContainer.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
